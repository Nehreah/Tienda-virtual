version: '3.8'

services:
  app:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # S-6: APP_ENV debe ser 'production' en despliegue real.
      # El parser solo acepta 'local' o 'production'.
      - APP_ENV=${APP_ENV:-production}
      - PORT=${PORT:-8080}
      # Supabase / PostgreSQL — incluir sslmode para producción
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL es obligatoria (ej: jdbc:postgresql://host:5432/db?sslmode=require)}
      - DATABASE_USER=${DATABASE_USER:?DATABASE_USER es obligatoria}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD es obligatoria}
      # Dashboard
      - DASHBOARD_USER=${DASHBOARD_USER:?DASHBOARD_USER es obligatoria}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:?DASHBOARD_PASSWORD es obligatoria (mín. 12 chars)}
      # Gemini AI
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Meta / WhatsApp
      - META_APP_SECRET=${META_APP_SECRET:-}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - META_CATALOG_ID=${META_CATALOG_ID:-}
      - META_PHONE_NUMBER_ID=${META_PHONE_NUMBER_ID:-}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-}
      # Shopify
      - SHOPIFY_SHOP_DOMAIN=${SHOPIFY_SHOP_DOMAIN:-}
      - SHOPIFY_ACCESS_TOKEN=${SHOPIFY_ACCESS_TOKEN:-}
      - SHOPIFY_WEBHOOK_SECRET=${SHOPIFY_WEBHOOK_SECRET:-}
      - SHOPIFY_LOCATION_ID=${SHOPIFY_LOCATION_ID:-}
      # Seguridad y red
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - CORS_ALLOWED_HOST=${CORS_ALLOWED_HOST:-}
      # Instrucciones de pago (se muestra al cliente al confirmar)
      - PAYMENT_INSTRUCTIONS=${PAYMENT_INSTRUCTIONS:-}
      # Sincronización saliente (mantener en false hasta probar con tienda de pruebas)
      - CHANNEL_WRITE_ENABLED=${CHANNEL_WRITE_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-tiendadb}
      - POSTGRES_USER=${POSTGRES_USER:-tiendauser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria}
    # S-6: No publicar el puerto 5432 al exterior en producción.
    # Solo exponer si necesitas acceso local de desarrollo.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tiendauser} -d ${POSTGRES_DB:-tiendadb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
