# Despliegue en un servidor propio (p. ej. Oracle Cloud): app + PostgreSQL + Caddy (HTTPS automático).
# Uso: copia .env.example a .env, complétalo y ejecuta:  docker compose up -d --build
# Detalles paso a paso en docs/DESPLIEGUE_ORACLE.md

services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?DOMAIN es obligatorio (ej. tienda.midominio.com, con su registro DNS apuntando a este servidor)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: .
    # Solo accesible desde el propio servidor: el público entra por Caddy (HTTPS).
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - PORT=8080
      # La base está en la red interna de Docker (host "db"): se permite sin SSL. Para una base externa usa ...?sslmode=require
      - DATABASE_URL=${DATABASE_URL:-jdbc:postgresql://db:5432/${POSTGRES_DB:-tiendadb}?sslmode=disable}
      # Por defecto usan los mismos valores que el contenedor de la base, así no pueden quedar distintos.
      - DATABASE_USER=${DATABASE_USER:-${POSTGRES_USER:-tiendauser}}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria}}
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:?DASHBOARD_PASSWORD es obligatoria (12+ caracteres)}
      - CHANNEL_WRITE_ENABLED=${CHANNEL_WRITE_ENABLED:-false}
      # Hay exactamente un proxy de confianza delante (Caddy).
      - TRUST_PROXY=${TRUST_PROXY:-true}
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-1}
      - CORS_ALLOWED_HOST=${CORS_ALLOWED_HOST:-}
      - PAYMENT_INSTRUCTIONS=${PAYMENT_INSTRUCTIONS:-}
      - META_APP_SECRET=${META_APP_SECRET:-}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - META_PAGE_ID=${META_PAGE_ID:-}
      - META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - SHOPIFY_SHOP_DOMAIN=${SHOPIFY_SHOP_DOMAIN:-}
      - SHOPIFY_ACCESS_TOKEN=${SHOPIFY_ACCESS_TOKEN:-}
      - SHOPIFY_WEBHOOK_SECRET=${SHOPIFY_WEBHOOK_SECRET:-}
      - SHOPIFY_LOCATION_ID=${SHOPIFY_LOCATION_ID:-}
      - SHOPIFY_API_VERSION=${SHOPIFY_API_VERSION:-2024-10}
      - META_CATALOG_ID=${META_CATALOG_ID:-}
      - META_COUNTRY_CODE=${META_COUNTRY_CODE:-CO}
      - META_GRAPH_API_VERSION=${META_GRAPH_API_VERSION:-v26.0}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://${DOMAIN}}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # El tablero exige clave: basta con que el puerto responda.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-tiendadb}
      - POSTGRES_USER=${POSTGRES_USER:-tiendauser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria}
    # Solo accesible desde el propio servidor (nunca expuesto a Internet).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tiendauser} -d ${POSTGRES_DB:-tiendadb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
