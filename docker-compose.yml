version: '3.8'

services:
  app:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - PORT=${PORT:-8080}
      - DATABASE_URL=${DATABASE_URL:-jdbc:postgresql://db:5432/tiendadb?sslmode=disable}
      - DATABASE_USER=${DATABASE_USER:-tiendauser}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD es obligatoria}
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:?DASHBOARD_PASSWORD es obligatoria}
      - CHANNEL_WRITE_ENABLED=${CHANNEL_WRITE_ENABLED:-false}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - CORS_ALLOWED_HOST=${CORS_ALLOWED_HOST:-}
      - PAYMENT_INSTRUCTIONS=${PAYMENT_INSTRUCTIONS:-}
      - META_APP_SECRET=${META_APP_SECRET:-}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - META_PAGE_ID=${META_PAGE_ID:-}
      - META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - SHOPIFY_SHOP_DOMAIN=${SHOPIFY_SHOP_DOMAIN:-}
      - SHOPIFY_ACCESS_TOKEN=${SHOPIFY_ACCESS_TOKEN:-}
      - SHOPIFY_WEBHOOK_SECRET=${SHOPIFY_WEBHOOK_SECRET:-}
      - SHOPIFY_LOCATION_ID=${SHOPIFY_LOCATION_ID:-}
      - SHOPIFY_API_VERSION=${SHOPIFY_API_VERSION:-2024-10}
      - META_CATALOG_ID=${META_CATALOG_ID:-}
      - META_COUNTRY_CODE=${META_COUNTRY_CODE:-CO}
      - META_GRAPH_API_VERSION=${META_GRAPH_API_VERSION:-v26.0}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-tiendadb}
      - POSTGRES_USER=${POSTGRES_USER:-tiendauser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tiendauser} -d ${POSTGRES_DB:-tiendadb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
